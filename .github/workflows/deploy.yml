name: Deploy search site to GitHub Pages

on:
  push:
    branches: [main]
    # a push that only changes the manual or README does not change the site, so it need not redeploy it
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        # Stage 6 only needs fpdf2 (PDF transcript downloads, added 2026-09-22) -- not the whole
        # requirements.txt, which also lists mlx-whisper (Apple Silicon-only, irrelevant here and
        # would fail to install on this Linux runner)
        run: pip install fpdf2 Pillow
      - name: Build site + Pagefind index
        # this GitHub copy is the test site: it always asks search engines not to list it, even after techspressionism.com/archive/ is opened to them
        env:
          TVA_NOINDEX: "1"
          TVA_SHOW_DRAFTS: "1"      # the test copy shows draft synopses (marked DRAFT); techspressionism.com never does
        run: python3 scripts/06-build-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
